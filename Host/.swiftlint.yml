opt_in_rules:
  - force_unwrapping
  
excluded:
  - Carthage
  - Pods
  - .build

identifier_name:
  allowed_symbols: ['_']

type_name:
  allowed_symbols: ['_']

disabled_rules:
  # see https://github.com/realm/SwiftLint/issues/5263
  - non_optional_string_data_conversion

# Mulg's host files grew past SwiftLint's default error limits; keep these as warnings.
line_length:
  warning: 200
  error: 500
function_body_length:
  warning: 100
  error: 200
type_body_length:
  warning: 350
  error: 700
